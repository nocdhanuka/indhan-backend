<!DOCTYPE html> 
<html> 

<head> 
	<title> 
		How to disable autocomplete 
		of an HTML input field? 
	</title> 

	<style> 
		h1, 
		h2 { 
			font-family: impact; 
		} 
	</style> 
</head> 

<body style="text-align:center;"> 

	<h1>GeeksForGeeks</h1> 

	<h2> 
		How to disable autocomplete 
		of an HTML input field? 
	</h2> 

	<form role="form" id="ad_login" method="post" action="">
        <div class="form-group has-feedback">
            <input type="text" placeholder="Username" id="username" name="username" class="form-control" value="" required>
            <span class="glyphicon glyphicon-envelope form-control-feedback"></span>
        </div>
        <div class="form-group has-feedback">
            <input type="password" id="password" name="password" class="form-control" placeholder="Password" value="" autocomplete="new-password" required>
            <span class="glyphicon glyphicon-lock form-control-feedback"></span>
        </div>
        <div class="row">
            <div class="col-xs-8">
                <div class="checkbox icheck">
                    <label>
                        <input name="remember" id="remember" type="checkbox" value="1"> Remember Me
                    </label>
                </div>
            </div><!-- /.col -->
            <div class="col-xs-4">
                <!-- <input type="submit" class="btn btn-primary btn-block btn-flat log_admin" value="Sign In"> -->
                <a type="button" class="btn btn-primary btn-block btn-flat log_admin btnSubmit">Sign In</a>
            </div><!-- /.col -->
        </div>
        <div class="msg_ad"></div>
    </form>
</body> 

</html>
